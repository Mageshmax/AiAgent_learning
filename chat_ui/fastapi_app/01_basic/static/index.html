<!DOCTYPE html>
<!--
  FastAPI step 1: the chat page (frontend).
  HTML = what is on the page, CSS = how it looks, JavaScript = what it does.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Chat Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f5; margin: 0; }
    .app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; box-sizing: border-box; }
    h1 { font-size: 1.4rem; }
    #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #2563eb; color: white; }
    .assistant { align-self: flex-start; background: white; border: 1px solid #e4e4e7; }
    form { display: flex; gap: 8px; padding: 12px 0 20px; }
    input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #d4d4d8; border-radius: 10px; }
    button { padding: 0 18px; font-size: 1rem; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <h1>🤖 Claude Chat Agent</h1>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="Ask me anything (weather, time, maths...)" autocomplete="off" autofocus>
      <button id="send">Send</button>
    </form>
  </div>

  <script>
    // Grab the page elements we need.
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");

    // Add a chat bubble to the page and return it.
    function addBubble(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;  // CSS class "user" or "assistant"
      bubble.textContent = text;             // textContent = plain text (safe)
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;    // scroll to the newest message
      return bubble;
    }

    // Runs when you press Enter or click Send.
    form.addEventListener("submit", async (event) => {
      event.preventDefault();                // stop the browser reloading the page
      const question = input.value.trim();
      if (!question) return;

      addBubble("user", question);
      input.value = "";
      send.disabled = true;
      const bubble = addBubble("assistant", "Thinking...");

      try {
        // Send the question to our server's POST /chat route, as JSON.
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: question }),
        });
        const data = await response.json();  // {"reply": "..."}
        bubble.textContent = data.reply;
      } catch (error) {
        bubble.textContent = "Error: " + error;
      }

      send.disabled = false;
      chat.scrollTop = chat.scrollHeight;
      input.focus();
    });
  </script>
</body>
</html>
