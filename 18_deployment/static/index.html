<!DOCTYPE html>
<!--
  Lesson 18: the chat page from FastAPI step 5, for a deployed server.
  New here:
    - an ACCESS KEY: asked once, kept in localStorage, sent as the
      X-Access-Key header on every request (api() below)
    - server answers 401 (wrong key) / 429 (too many messages) are shown
    - "error" events from the agent are shown in red
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Chat Agent</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f4f5; margin: 0; }
    .app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; box-sizing: border-box; }
    header { display: flex; align-items: center; justify-content: space-between; }
    h1 { font-size: 1.4rem; }
    #clear, #key { background: white; color: #3f3f46; border: 1px solid #d4d4d8; padding: 8px 14px; }
    #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
    .bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #2563eb; color: white; }
    .assistant { align-self: flex-start; background: white; border: 1px solid #e4e4e7; }
    /* NEW: tool boxes */
    .tool { background: #f4f4f5; border: 1px solid #e4e4e7; border-radius: 8px; padding: 6px 10px; margin: 6px 0; font-size: 0.9rem; }
    .tool summary { cursor: pointer; font-family: ui-monospace, monospace; }
    .tool pre { margin: 6px 0 0; white-space: pre-wrap; }
    .error { color: #b91c1c; }
    .buttons { display: flex; gap: 8px; }
    form { display: flex; gap: 8px; padding: 12px 0 20px; }
    input { flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #d4d4d8; border-radius: 10px; }
    button { padding: 0 18px; font-size: 1rem; border: 0; border-radius: 10px; background: #2563eb; color: white; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>🤖 Claude Chat Agent</h1>
      <div class="buttons">
        <button id="key">🔑 Key</button>
        <button id="clear">🗑️ New chat</button>
      </div>
    </header>
    <div id="chat"></div>
    <form id="form">
      <input id="input" placeholder="Ask me anything (weather, time, maths...)" autocomplete="off" autofocus>
      <button id="send">Send</button>
    </form>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const clear = document.getElementById("clear");
    const keyButton = document.getElementById("key");

    // NEW: the access key. Asked once, then kept in this browser.
    function askForKey() {
      const key = prompt("Access key for this chat:");
      if (key) localStorage.setItem("accessKey", key.trim());
      return key;
    }
    if (!localStorage.getItem("accessKey")) askForKey();
    keyButton.addEventListener("click", () => { askForKey(); location.reload(); });

    // NEW: every request goes through here, so every request carries the key.
    async function api(url, options = {}) {
      const headers = { "Content-Type": "application/json", "X-Access-Key": localStorage.getItem("accessKey") || "" };
      const response = await fetch(url, { ...options, headers });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        const detail = typeof body.detail === "string" ? body.detail : "Request failed.";
        throw new Error(`${response.status}: ${detail}`);
      }
      return response;
    }

    // This browser's session id. localStorage keeps it even after a
    // page reload, so the server can find this browser's memory again.
    let sessionId = localStorage.getItem("sessionId");
    if (!sessionId) {
      sessionId = crypto.randomUUID();  // e.g. "3b241101-e2bb-4255-8caf-4136c566a962"
      localStorage.setItem("sessionId", sessionId);
    }

    function addBubble(role, text) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.textContent = text;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    async function readStream(response, onEvent) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          if (line.trim()) onEvent(JSON.parse(line));
        }
      }
    }

    // One reply = a bubble + "where does the next text go" + "the open tool box".
    function startReply() {
      return { bubble: addBubble("assistant", ""), textPart: null, toolBox: null };
    }

    // Add one streamed event to a reply.
    function handleEvent(reply, ev) {
      if (ev.type === "text") {
        if (!reply.textPart) {  // first text, or text after a tool box -> new text part
          reply.textPart = document.createElement("div");
          reply.bubble.appendChild(reply.textPart);
        }
        reply.textPart.textContent += ev.text;
      } else if (ev.type === "tool_call") {
        const box = document.createElement("details");  // built-in collapsible box
        box.className = "tool";
        const summary = document.createElement("summary");
        summary.textContent = `🔧 ${ev.name}(${JSON.stringify(ev.input)})`;
        const result = document.createElement("pre");
        result.textContent = "running...";
        box.append(summary, result);
        reply.bubble.appendChild(box);
        reply.toolBox = box;
        reply.textPart = null;  // text after this tool goes BELOW the box
      } else if (ev.type === "tool_result") {
        reply.toolBox.querySelector("pre").textContent = ev.result;
        reply.toolBox.querySelector("summary").textContent += "  ✓";
      } else if (ev.type === "error") {  // NEW
        const part = document.createElement("div");
        part.className = "error";
        part.textContent = "⚠️ " + ev.text;
        reply.bubble.appendChild(part);
        reply.textPart = null;
      }
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question) return;

      addBubble("user", question);
      input.value = "";
      send.disabled = true;
      const reply = startReply();

      try {
        const response = await api("/chat", {
          method: "POST",
          body: JSON.stringify({ session_id: sessionId, message: question }),
        });
        await readStream(response, (ev) => handleEvent(reply, ev));
      } catch (error) {
        handleEvent(reply, { type: "error", text: error.message });
        if (error.message.startsWith("401")) askForKey();
      }

      send.disabled = false;
      input.focus();
    });

    // The New chat button. Clear the server's memory, then the screen.
    clear.addEventListener("click", async () => {
      await api("/clear", { method: "POST", body: JSON.stringify({ session_id: sessionId }) });
      chat.innerHTML = "";  // remove every bubble from the page
      input.focus();
    });

    // When the page opens, fetch this browser's old chat and draw it.
    async function loadHistory() {
      let events = [];
      try {
        const response = await api("/history?session_id=" + encodeURIComponent(sessionId));
        events = await response.json();
      } catch (error) {
        addBubble("assistant error", error.message + " (click 🔑 Key to enter the right key)");
      }
      let reply = null;
      for (const ev of events) {
        if (ev.type === "user") {
          addBubble("user", ev.text);
          reply = null;               // the next events belong to a NEW reply
        } else {
          if (!reply) reply = startReply();
          handleEvent(reply, ev);     // same function as live replies
        }
      }
    }
    loadHistory();
  </script>
</body>
</html>
